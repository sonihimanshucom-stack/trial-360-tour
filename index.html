<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Radisson Blu Udaipur · Virtual Tour</title>
  <meta name="description" content="Explore Radisson Blu Udaipur Palace Resort & Spa in immersive 360° — the arrival court, palace drive, grand lawn, jharokha courtyard and ballroom." />
  <meta name="theme-color" content="#070a12" />
  <meta property="og:title" content="Radisson Blu Udaipur · Virtual Tour" />
  <meta property="og:description" content="An immersive 360° journey through the palace resort." />
  <meta property="og:image" content="assets/pano/arrival-thumb.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="preload" as="fetch" href="assets/pano/arrival-2k.jpg" crossorigin />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="pano" aria-label="360° panorama — drag to look around"></canvas>
  <div class="shade shade-top"></div>
  <div class="shade shade-bottom"></div>

  <!-- hotspots are injected here and positioned every frame -->
  <div id="hotspots" class="hotspots"></div>

  <!-- loader -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <div class="monogram" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M14 58V30C14 19 22 11 32 5c10 6 18 14 18 25v28" /><path d="M22 58V33c0-7 4-12 10-16 6 4 10 9 10 16v25" /><path d="M8 58h48" /><circle cx="32" cy="3" r="1.4" /></svg>
      </div>
      <p class="eyebrow">Radisson Blu</p>
      <h1 class="loader-title">Udaipur Palace<br /><em>Resort &amp; Spa</em></h1>
      <div class="progress"><span id="progress-bar"></span></div>
      <p class="loader-note" id="loader-note">Preparing your journey</p>
    </div>
  </div>

  <!-- intro title shown over the little planet -->
  <div id="intro" class="intro" aria-hidden="true">
    <p class="eyebrow">A virtual journey</p>
    <h2 class="intro-title">Udaipur Palace<br /><em>Resort &amp; Spa</em></h2>
    <span class="rule"></span>
    <button id="skip-intro" class="skip">Skip intro</button>
  </div>

  <!-- top bar -->
  <header class="topbar ui">
    <a class="brand" href="#" aria-label="Restart tour">
      <span class="brand-mark">Radisson Blu</span>
      <span class="brand-name">Udaipur Palace Resort &amp; Spa</span>
    </a>
    <nav class="actions" aria-label="Viewer controls">
      <button class="icon-btn" id="btn-play" title="Guided tour" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
        <span class="btn-label">Guided tour</span>
      </button>
      <button class="icon-btn" id="btn-planet" title="Little planet view" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="5" /><path d="M12 8V3M8.5 9.5 6 6M15.5 9.5 18 6M7 13H3M21 13h-4" stroke-linecap="round" /></svg>
      </button>
      <button class="icon-btn" id="btn-gyro" title="Motion control" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="3" width="10" height="18" rx="2.2" /><path d="M3.5 9a10 10 0 0 0 0 6M20.5 9a10 10 0 0 1 0 6" stroke-linecap="round" /></svg>
        <span class="btn-label">Gyro</span>
      </button>
      <button class="icon-btn" id="btn-share" title="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button class="icon-btn" id="btn-fs" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <a class="enquire" id="btn-enquire" target="_blank" rel="noopener">Enquire</a>
    </nav>
  </header>

  <!-- scene caption -->
  <section class="caption ui" aria-live="polite">
    <p class="caption-index"><span id="cap-index">01</span><i></i><span id="cap-total">05</span></p>
    <h2 class="caption-title" id="cap-title"></h2>
    <p class="caption-sub" id="cap-sub"></p>
    <button class="caption-more" id="cap-more">About this space
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
  </section>

  <!-- resort map -->
  <aside class="minimap ui" id="minimap" aria-label="Resort map">
    <p class="mini-label">Resort map</p>
    <svg id="map-svg" viewBox="0 0 100 100"></svg>
  </aside>

  <!-- scene dock -->
  <footer class="dock ui">
    <button class="dock-toggle" id="dock-toggle" aria-expanded="true" title="Show / hide scenes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 15l6-6 6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <span>Scenes</span>
    </button>
    <div class="dock-track" id="dock"></div>
  </footer>

  <!-- info panel -->
  <aside class="panel" id="panel" aria-hidden="true">
    <button class="panel-close" id="panel-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round" /></svg>
    </button>
    <p class="eyebrow" id="panel-eyebrow"></p>
    <h3 class="panel-title" id="panel-title"></h3>
    <span class="rule"></span>
    <p class="panel-text" id="panel-text"></p>
  </aside>

  <div class="hint" id="hint"><span class="hint-hand"></span><span id="hint-text">Drag to explore</span></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="fallback" id="fallback" hidden>
    <p>This virtual tour needs a browser with WebGL 2 support.</p>
  </div>

  <script type="module" src="js/tour.js"></script>
</body>
</html>
